<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' - Environmental Incidents'">Title</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
</head>
<body>
<nav th:fragment="navbar" class="navbar navbar-dark bg-success mb-4">
    <div class="container">
        <div class="d-flex align-items-center">
            <a class="navbar-brand" th:href="@{/}">Environmental Incidents</a>
            <a class="nav-link text-white" th:if="${currentUser != null}"
               th:href="@{/incidents}">Incidents</a>
            <a class="nav-link text-white" th:if="${currentUser != null}"
               th:href="@{/my-actions}">My actions</a>
            <a class="nav-link text-white"
               th:if="${currentUser != null and (currentUser.officer or currentUser.manager)}"
               th:href="@{/reports}">Reports</a>
        </div>
        <div class="d-flex align-items-center text-white" th:if="${currentUser != null}">
            <span class="me-3">
                <span th:text="${currentUser.name}">Name</span>
                <span class="badge bg-light text-dark" th:text="${currentUser.role}">ROLE</span>
            </span>
            <form th:action="@{/logout}" method="post">
                <button class="btn btn-outline-light btn-sm">Log out</button>
            </form>
        </div>
    </div>
</nav>
</body>
</html>
