<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('New incident')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>
<div class="container" style="max-width: 720px;">
    <h1 class="h4 mb-3">Register incident</h1>

    <div class="alert alert-danger" th:if="${error}" th:text="${error}">Error</div>

    <form th:action="@{/incidents}" th:object="${form}" method="post">
        <div class="mb-3">
            <label class="form-label" for="title">Title</label>
            <input class="form-control" id="title" th:field="*{title}" maxlength="120" required>
            <div class="text-danger small" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="description">Description</label>
            <textarea class="form-control" id="description" rows="4" th:field="*{description}"
                      maxlength="2000" required></textarea>
            <div class="text-danger small" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
        </div>
        <div class="row">
            <div class="col-md-4 mb-3">
                <label class="form-label" for="type">Type</label>
                <select class="form-select" id="type" th:field="*{type}" required>
                    <option value="">Select...</option>
                    <option th:each="t : ${types}" th:value="${t}" th:text="${t}">TYPE</option>
                </select>
                <div class="text-danger small" th:if="${#fields.hasErrors('type')}" th:errors="*{type}"></div>
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label" for="severity">Severity</label>
                <select class="form-select" id="severity" th:field="*{severity}" required>
                    <option value="">Select...</option>
                    <option th:each="s : ${severities}" th:value="${s}" th:text="${s}">SEVERITY</option>
                </select>
                <div class="text-danger small" th:if="${#fields.hasErrors('severity')}" th:errors="*{severity}"></div>
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label" for="sectorId">Sector</label>
                <select class="form-select" id="sectorId" th:field="*{sectorId}" required>
                    <option value="">Select...</option>
                    <option th:each="s : ${sectors}" th:value="${s.id()}" th:text="${s.name()}">Sector</option>
                </select>
                <div class="text-danger small" th:if="${#fields.hasErrors('sectorId')}" th:errors="*{sectorId}"></div>
            </div>
        </div>
        <div class="mb-4">
            <label class="form-label" for="occurredOn">Date it occurred</label>
            <input class="form-control" type="date" id="occurredOn" th:field="*{occurredOn}" required>
            <div class="text-danger small" th:if="${#fields.hasErrors('occurredOn')}" th:errors="*{occurredOn}"></div>
        </div>
        <button class="btn btn-success">Register</button>
        <a class="btn btn-outline-secondary" th:href="@{/incidents}">Cancel</a>
    </form>
</div>
</body>
</html>
